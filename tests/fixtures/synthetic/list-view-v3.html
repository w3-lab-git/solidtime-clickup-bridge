<!doctype html>
<!-- Modelled on ClickUp's newer List view (list-view-v3, 2026-11): a virtual table of .vgt-row rows, the task name in cu-task-row-main, rows grouped by assignee (no List groups). -->
<html>
<head><meta charset="utf-8"><title>List | Bugs | ClickUp</title></head>
<body class="cu-v3">
  <header class="cu-view-header">
    <cu-breadcrumb>
      <cu-breadcrumb-item><span class="avatar-initials">S</span><span>Clients</span></cu-breadcrumb-item>
      <cu-breadcrumb-item><span>Acme</span></cu-breadcrumb-item>
      <cu-breadcrumb-item><span>Bugs</span></cu-breadcrumb-item>
    </cu-breadcrumb>
    <div class="location-title__container">
      <cu-editable class="cu-editable"><div data-test="location-editable__location-title" class="location-title">Bugs</div></cu-editable>
    </div>
  </header>
  <main>
    <div class="vgt-row vgt-row--cells">
      <div class="vgt-frozen-cols vgt-drag-passthrough">
        <div class="vgt-cell-fixed">
          <cu-data-table-cell>
            <cu-task-name-cell class="cu-task-name-cell">
              <div class="cu-task-name-cell__main"><cu-task-row-status class="cu-task-name-cell__status"></cu-task-row-status><div class="cu-task-name-cell__name-col"><div class="cu-task-name-cell__name-row"><div class="cu-task-name-cell__name">
                <cu-editable class="cu-editable cu-task-name-cell__editable">
                  <cu-task-row-main class="cu-task-row-main cu-task-row-main_list-view-v3">
                    <a data-test="task-row-main__link" class="cu-task-row-main__link" href="https://app.clickup.com/t/9012345/86c1fffff" draggable="false">
                      <div class="cu-task-row-main__link-text"><span class="cu-task-row-main__link-text-inner">Fix checkout total</span></div>
                    </a>
                  </cu-task-row-main>
                </cu-editable>
              </div></div></div></div>
            </cu-task-name-cell>
          </cu-data-table-cell>
        </div>
      </div>
    </div>
    <div class="vgt-row vgt-row--cells">
      <div class="vgt-frozen-cols vgt-drag-passthrough">
        <div class="vgt-cell-fixed">
          <cu-data-table-cell>
            <cu-task-name-cell class="cu-task-name-cell">
              <div class="cu-task-name-cell__main"><cu-task-row-status class="cu-task-name-cell__status"></cu-task-row-status><div class="cu-task-name-cell__name-col"><div class="cu-task-name-cell__name-row"><div class="cu-task-name-cell__name">
                <cu-editable class="cu-editable cu-task-name-cell__editable">
                  <cu-task-row-main class="cu-task-row-main cu-task-row-main_list-view-v3">
                    <a data-test="task-row-main__link" class="cu-task-row-main__link" href="https://app.clickup.com/t/9012345/86c1ggggg" draggable="false">
                      <div class="cu-task-row-main__link-text"><span class="cu-task-row-main__link-text-inner">Broken coupon field</span></div>
                    </a>
                  </cu-task-row-main>
                </cu-editable>
              </div></div></div></div>
            </cu-task-name-cell>
          </cu-data-table-cell>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
